<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新家收納需求</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap">
<style>
  :root{
    --bg:#F1EBDF;
    --surface:#FAF6EE;
    --surface-2:#EAE2D3;
    --ink:#38332B;
    --muted:#857C6E;
    --faint:#ABA292;
    --line:#E5DCCC;
    --accent:#8A7150;
    --accent-deep:#6B5638;
    --accent-soft:#E9DFCC;
    --shadow:0 1px 1px rgba(56,51,43,.03),0 8px 24px -20px rgba(56,51,43,.35);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#1B1813;
      --surface:#24201A;
      --surface-2:#2E2A22;
      --ink:#EEE7D9;
      --muted:#A79D8B;
      --faint:#766E5E;
      --line:#332F27;
      --accent:#C7AC82;
      --accent-deep:#D8C4A0;
      --accent-soft:#2D2820;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 34px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#1B1813;
    --surface:#24201A;
    --surface-2:#2E2A22;
    --ink:#EEE7D9;
    --muted:#A79D8B;
    --faint:#766E5E;
    --line:#332F27;
    --accent:#C7AC82;
    --accent-deep:#D8C4A0;
    --accent-soft:#2D2820;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 34px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC",system-ui,sans-serif;
    font-weight:400;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.01em;
  }
  .wrap{max-width:940px;margin:0 auto;padding:clamp(28px,5vw,68px) clamp(18px,4vw,40px) 90px}

  header{margin-bottom:clamp(30px,5vw,52px)}
  .kicker{
    font-size:12px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--accent);font-weight:700;margin:0 0 18px;
    display:flex;align-items:center;gap:12px;
  }
  .kicker::after{content:"";height:1px;flex:1;background:var(--line)}
  h1{
    font-family:"Noto Serif TC",serif;font-weight:700;
    font-size:clamp(34px,7vw,58px);line-height:1.08;margin:0;
    letter-spacing:.01em;text-wrap:balance;
  }
  h1 .light{color:var(--accent);font-weight:500}
  .lede{
    margin:20px 0 0;max-width:46ch;color:var(--muted);
    font-size:clamp(15px,2vw,17px);font-weight:300;line-height:1.75;
  }
  .meta{
    margin-top:26px;display:flex;flex-wrap:wrap;gap:10px 26px;
    padding-top:22px;border-top:1px solid var(--line);
    font-size:13.5px;color:var(--muted);
  }
  .meta b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

  .zone{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:clamp(20px,3vw,30px);margin-bottom:18px;box-shadow:var(--shadow);
  }
  .zone-head{
    display:flex;align-items:baseline;gap:16px;
    padding-bottom:16px;margin-bottom:18px;border-bottom:1px solid var(--line);
  }
  .idx{
    font-family:"Noto Serif TC",serif;font-weight:500;font-size:14px;
    color:var(--faint);font-variant-numeric:tabular-nums;line-height:2.2;
  }
  .zone-title{flex:1;min-width:0}
  .zone-title h2{
    font-family:"Noto Serif TC",serif;font-weight:600;
    font-size:clamp(21px,3.4vw,27px);margin:0;line-height:1.2;
  }
  .zone-title .en{
    font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--faint);font-weight:500;margin-top:5px;
  }
  .count{
    flex-shrink:0;align-self:center;font-size:12px;font-weight:500;
    color:var(--accent-deep);background:var(--accent-soft);
    padding:4px 12px;border-radius:999px;font-variant-numeric:tabular-nums;
  }

  ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  li.item{
    display:flex;gap:13px;align-items:flex-start;
    padding:9px 8px 9px 6px;border-radius:9px;cursor:pointer;
    transition:background .15s ease;
  }
  li.item:hover{background:var(--surface-2)}
  .box{
    flex-shrink:0;width:19px;height:19px;margin-top:4px;border-radius:6px;
    border:1.6px solid var(--line);background:var(--surface);
    display:grid;place-items:center;transition:all .15s ease;
  }
  .box svg{width:12px;height:12px;stroke:var(--surface);stroke-width:3;
    fill:none;opacity:0;transition:opacity .15s ease}
  li.item.done .box{background:var(--accent);border-color:var(--accent)}
  li.item.done .box svg{opacity:1}
  li.item.done .txt{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
  .txt{font-size:15.5px;line-height:1.6}
  .txt .note{display:block;color:var(--muted);font-size:13.5px;font-weight:300;margin-top:1px}

  .zone.callout{background:var(--accent-soft);border-color:transparent}
  .zone.callout .zone-head{border-color:color-mix(in srgb,var(--accent) 22%,transparent)}
  .zone.callout li.item:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .zone.callout .box{background:color-mix(in srgb,var(--surface) 55%,transparent)}
  .callout-note{font-size:13.5px;color:var(--muted);margin:-4px 0 14px;font-weight:300}

  footer{margin-top:34px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.8}
  .reset{
    background:none;border:1px solid var(--line);color:var(--muted);
    font:inherit;font-size:12.5px;padding:7px 16px;border-radius:999px;
    cursor:pointer;transition:all .15s ease;margin-bottom:16px;
  }
  .reset:hover{border-color:var(--accent);color:var(--accent)}
  .theme-toggle{
    position:fixed;top:clamp(12px,2.5vw,20px);right:clamp(12px,2.5vw,20px);z-index:20;
    width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);cursor:pointer;
    display:grid;place-items:center;box-shadow:var(--shadow);transition:all .15s ease;
  }
  .theme-toggle:hover{color:var(--accent);border-color:var(--accent)}
  .theme-toggle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .theme-toggle .moon{display:none}
  :root[data-theme="dark"] .theme-toggle .sun{display:none}
  :root[data-theme="dark"] .theme-toggle .moon{display:block}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .theme-toggle .sun{display:none}
    :root:not([data-theme="light"]) .theme-toggle .moon{display:block}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:520px){
    .zone-head{gap:11px}
    .meta{gap:8px 18px}
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切換深淺色">
  <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/></svg>
</button>
<div class="wrap">
  <header>
    <p class="kicker">給設計師的空間需求</p>
    <h1>新家收納<span class="light">＆機能清單</span></h1>
    <p class="lede">依照進門到房間的動線，把每個空間想要的收納與機能整理成一份清單。括號內是補充說明，方便討論時對照。</p>
    <div class="meta">
      <span>共 <b>7</b> 個空間</span>
      <span><b id="total">0</b> 項需求</span>
      <span>可點選項目<b> 打勾</b>確認</span>
    </div>
  </header>

  <main id="zones"></main>

  <footer>
    <button class="reset" id="reset">清除所有勾選</button>
    <div>勾選狀態只存在你這台裝置的瀏覽器，重新整理不會消失。</div>
  </footer>
</div>

<script>
// theme: no stamp = follow system; explicit choice persists per device
const THEME_KEY="xinjia-theme";
const root=document.documentElement;
try{const t=localStorage.getItem(THEME_KEY);if(t==="dark"||t==="light")root.setAttribute("data-theme",t);}catch(e){}
document.getElementById("themeToggle").addEventListener("click",()=>{
  const sysDark=matchMedia("(prefers-color-scheme:dark)").matches;
  const cur=root.getAttribute("data-theme")||(sysDark?"dark":"light");
  const next=cur==="dark"?"light":"dark";
  root.setAttribute("data-theme",next);
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
});

const data=[
 {t:"玄關",en:"Entryway",items:[
   {x:"落塵區"},
   {x:"全身鏡",n:"灰鏡那種"},
   {x:"玄關櫃 + 抽屜",n:"放鑰匙、手錶、口罩、香水"},
   {x:"放外出包包、小孩書包、便當盒的地方"},
   {x:"穿鞋椅"},
   {x:"鞋櫃",n:"旋轉式鞋架"},
   {x:"常穿的鞋要有開放式位置"},
 ]},
 {t:"飯廳",en:"Dining",items:[
   {x:"置物櫃收納生活用品",n:"小倉庫概念"},
   {x:"餐桌旁牆壁是否可做上下置物櫃"},
   {x:"電器櫃",n:"電鍋、微波爐、氣炸鍋"},
   {x:"放消毒鍋的地方"},
   {x:"電器櫃連接置物櫃，上方可加零食櫃嗎"},
 ]},
 {t:"廚房",en:"Kitchen",items:[
   {x:"廚房後面要收納櫃"},
   {x:"抽屜放調味料的地方"},
 ]},
 {t:"客廳",en:"Living Room",items:[
   {x:"電視牆要有氣氛燈"},
   {x:"展示櫃 or 格子櫃"},
   {x:"電視櫃懸空",n:"中間路由器那類想包起來（例如柵欄）"},
   {x:"電視櫃抽屜只放遙控器小東西",n:"不用太深；留任家那樣的深度我們覺得太深了"},
   {x:"預留音響 Soundbar"},
   {x:"L 型沙發兩側不須放桌子"},
 ]},
 {t:"收納家電",en:"Appliances",callout:true,
  note:"需要幫以下五位各找一個家安置：",items:[
   {x:"掃地機器人"},
   {x:"吸塵器"},
   {x:"電風扇"},
   {x:"除濕機"},
   {x:"行李箱"},
 ]},
 {t:"陽台",en:"Balcony",items:[
   {x:"汙衣籃",n:"分大人、小孩兩區"},
   {x:"掛衣架區"},
   {x:"曬衣桿"},
 ]},
 {t:"電腦間更衣室",en:"Study & Closet",items:[
   {x:"汙衣櫃",n:"通風、簍空；穿過一次但還不用洗的衣服"},
   {x:"衣櫃放大人的衣服"},
   {x:"包包區"},
   {x:"收納換季衣物、棉被"},
   {x:"褲架",n:"穿過一次的褲子"},
 ]},
];

const KEY="xinjia-needs-v1";
let state={};
try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){state={}}

const check='<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
const zones=document.getElementById("zones");
let total=0, id=0;

data.forEach((z,zi)=>{
  const items=z.items.map(it=>{
    const key="i"+(id++);
    const done=state[key]?" done":"";
    total++;
    const note=it.n?`<span class="note">${it.n}</span>`:"";
    return `<li class="item${done}" data-k="${key}">
      <span class="box">${check}</span>
      <span class="txt">${it.x}${note}</span></li>`;
  }).join("");
  const note=z.note?`<p class="callout-note">${z.note}</p>`:"";
  zones.insertAdjacentHTML("beforeend",`
    <section class="zone${z.callout?" callout":""}">
      <div class="zone-head">
        <span class="idx">${String(zi+1).padStart(2,"0")}</span>
        <div class="zone-title"><h2>${z.t}</h2><div class="en">${z.en}</div></div>
        <span class="count">${z.items.length} 項</span>
      </div>
      ${note}
      <ul class="items">${items}</ul>
    </section>`);
});
document.getElementById("total").textContent=total;

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
zones.addEventListener("click",e=>{
  const li=e.target.closest("li.item");if(!li)return;
  const k=li.dataset.k;
  if(li.classList.toggle("done"))state[k]=1;else delete state[k];
  save();
});
document.getElementById("reset").addEventListener("click",()=>{
  state={};save();
  document.querySelectorAll("li.item.done").forEach(li=>li.classList.remove("done"));
});
</script>
</body>
</html>
